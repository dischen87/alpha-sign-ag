name: Lighthouse CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Optional: Configure LHCI server for historical tracking
# Secrets needed for LHCI server (optional):
#   LHCI_TOKEN - Lighthouse CI server token
#   LHCI_SERVER_URL - URL of your LHCI server

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Run Lighthouse against the built static files
          staticDistDir: ./dist
          # Upload results as GitHub artifact
          uploadArtifacts: true
          # Temporary public storage for Lighthouse reports
          temporaryPublicStorage: true
          # Configuration file for Lighthouse (optional)
          configPath: ./lighthouserc.json

      - name: Format Lighthouse score
        id: format_lighthouse_score
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = '.lighthouseci';

            if (fs.existsSync(resultsPath)) {
              const files = fs.readdirSync(resultsPath);
              const jsonFile = files.find(f => f.endsWith('.json') && !f.includes('manifest'));

              if (jsonFile) {
                const results = JSON.parse(fs.readFileSync(`${resultsPath}/${jsonFile}`, 'utf8'));
                const categories = results.categories;

                const formatScore = (score) => Math.round(score * 100);
                const getEmoji = (score) => {
                  if (score >= 0.9) return ':green_circle:';
                  if (score >= 0.5) return ':yellow_circle:';
                  return ':red_circle:';
                };

                const scores = [
                  `| Performance | ${getEmoji(categories.performance.score)} ${formatScore(categories.performance.score)} |`,
                  `| Accessibility | ${getEmoji(categories.accessibility.score)} ${formatScore(categories.accessibility.score)} |`,
                  `| Best Practices | ${getEmoji(categories['best-practices'].score)} ${formatScore(categories['best-practices'].score)} |`,
                  `| SEO | ${getEmoji(categories.seo.score)} ${formatScore(categories.seo.score)} |`
                ].join('\n');

                const summary = `## Lighthouse Results\n\n| Category | Score |\n|----------|-------|\n${scores}`;

                core.setOutput('summary', summary);
                core.summary.addRaw(summary).write();
              }
            }

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.format_lighthouse_score.outputs.summary }}`;
            if (summary) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
